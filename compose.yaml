services:
  backend:
    build:
      context: ./employee-backend
    image: employee-backend:1.0
    ports:
      - "${BACKEND_PORT}:8081"
    networks:
      - employee-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/v1/employees')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./employee-frontend
      args:
        API_URL: ${API_URL}
    image: employee-frontend:1.0
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - employee-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  employee-net:
    driver: bridge
