server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html; # La bonne réponse est À éviter une erreur 404 quand on recharge une route Angular comme /employees./employees n'est pas un fichier sur le disque : c'est Angular qui gère la route. nginx renvoie index.html et Angular affiche la bonne page.
    }
}